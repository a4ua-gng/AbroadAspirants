<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
<title id="title">Abroad Aspirants</title><desc id="desc">A gradient globe with world landmarks in lavender, blue and turquoise.</desc>
<defs>
